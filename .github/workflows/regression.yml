name: Regression checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    name: Windows / Python ${{ matrix.python }} / Qt ${{ matrix.qt }} / scale ${{ matrix.scale }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            qt: "PySide6==6.8.3"
            scale: "1.0"
          - python: "3.14"
            qt: "PySide6>=6.8,<7"
            scale: "1.0"
          - python: "3.14"
            qt: "PySide6>=6.8,<7"
            scale: "1.25"
          - python: "3.14"
            qt: "PySide6>=6.8,<7"
            scale: "1.5"
    env:
      QT_QPA_PLATFORM: offscreen
      QT_SCALE_FACTOR: ${{ matrix.scale }}
      ETS_TEST_BANK: ${{ runner.temp }}/no-private-ets-bank
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install runtime and selected Qt version
        run: python -m pip install -r requirements.txt "${{ matrix.qt }}"
      - name: Run regression suite without a private bank
        shell: pwsh
        run: |
          python -m unittest discover -v *> regression.log
          $testExit = $LASTEXITCODE
          Get-Content -LiteralPath regression.log
          exit $testExit
      - name: Preserve test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-python-${{ matrix.python }}-scale-${{ matrix.scale }}
          path: regression.log
          if-no-files-found: ignore
          retention-days: 14
