name: Portable Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    uses: ./.github/workflows/regression.yml

  portable-windows:
    name: Build and smoke-test Windows x64 ZIP
    needs: regression
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build portable ZIP and checksum
        run: python tools/build_portable.py
      - name: Launch extracted app without Python on PATH
        run: python tools/smoke_portable.py dist/ETS-Viewer-windows-x64.zip
      - name: Upload tested portable build
        uses: actions/upload-artifact@v7
        with:
          name: ETS-Viewer-windows-x64
          path: |
            dist/ETS-Viewer-windows-x64.zip
            dist/ETS-Viewer-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+([-.][A-Za-z0-9.-]+)?$') {
            throw 'Release tags must use vMAJOR.MINOR.PATCH format.'
          }
          @'
          Portable Windows x64 build of ETS-Viewer.

          Download ETS-Viewer-windows-x64.zip, extract the complete folder, and open ETS-Viewer.exe. Keep the _internal folder beside the executable. Python and administrator access are not required.

          Bring your own ETS question bank; no question-bank files are included. The accompanying .sha256 file contains the ZIP's SHA-256 checksum. BUILD-INFO.txt identifies the source commit and bundled runtime versions.
          '@ | Set-Content -LiteralPath dist/release-notes.md -Encoding utf8
          gh release create "$env:GITHUB_REF_NAME" `
            dist/ETS-Viewer-windows-x64.zip dist/ETS-Viewer-windows-x64.zip.sha256 `
            --verify-tag --title "ETS-Viewer $env:GITHUB_REF_NAME" --notes-file dist/release-notes.md
